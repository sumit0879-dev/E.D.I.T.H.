name: Windows Build

on:
  push:
    branches:
      - main
      - ci/github-actions-setup
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Package Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git init .
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-cargo-release-

      - name: Build frontend
        run: npm run build

      - name: Run Rust cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build and package Tauri application
        run: npm run tauri build

      - name: Stage release artifacts & generate SHA256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          
          # Stage NSIS setup installer
          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisExe) {
              Copy-Item $nsisExe.FullName -Destination "staging/$($nsisExe.Name)"
              Write-Host "Staged NSIS installer: $($nsisExe.Name)"
          } else {
              Write-Error "NSIS installer not found in src-tauri/target/release/bundle/nsis/"
              exit 1
          }

          # Stage standalone binary
          $mainExe = "src-tauri/target/release/edith-v2.exe"
          if (Test-Path $mainExe) {
              Copy-Item $mainExe -Destination "staging/edith-v2.exe"
              Write-Host "Staged standalone executable: edith-v2.exe"
          } else {
              Write-Error "Standalone binary not found at $mainExe"
              exit 1
          }

          # Generate SHA256 checksum file
          Get-FileHash -Algorithm SHA256 -Path staging/*.exe | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content -Path staging/SHA256.txt
          Write-Host "Generated SHA256.txt checksums:"
          Get-Content staging/SHA256.txt

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: edith-windows-x64-build
          path: staging/*
          retention-days: 14
          if-no-files-found: error
