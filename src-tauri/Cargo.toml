[package]
name = "edith-v2"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "edith_v2_lib"
# Desktop builds only need the Rust library artifact (no cdylib).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# kokoro-micro = "1.0.0"

tauri = { version = "2.0.0", features = ["protocol-asset", "unstable"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.37", features = ["full"] }
scraper = "0.27.0"
lazy_static = "1.5.0"
regex = "1.12.3"
rodio = "0.22.2"
chrono = "=0.4.38"
urlencoding = "2.1.3"
open = "5.3.5"
edge-tts-rust = "0.1.3"



uuid = { version = "1.23.2", features = ["v4"] }

lancedb = "0.14"
arrow = "53.0"
arrow-schema = "53.0"
arrow-array = "53.0"
futures = "0.3"
screenshots = "0.8.10"
image = "0.25.10"
base64 = "0.22.1"
sha2 = "0.10"

[profile.dev]
debug = 0

